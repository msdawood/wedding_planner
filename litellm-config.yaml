# LiteLLM gateway: the only place the Anthropic API key lives, and the single spend choke point.
#
# Spend control layers (innermost wins):
#   1. Virtual key for the Celery worker  -> created by the `litellm_init` compose job with
#      max_budget / budget_duration / tpm_limit / rpm_limit taken from .env
#   2. Global proxy ceiling below         -> stops everything if all keys together overspend
# LiteLLM computes cost per request from token usage x its model price table, stores spend in
# its Postgres database, and rejects calls with a "budget exceeded" error once a limit is hit.

model_list:
  - model_name: claude-haiku                      # the name our app asks for (LITELLM_MODEL)
    litellm_params:
      model: anthropic/claude-haiku-4-5-20251001
      api_key: os.environ/ANTHROPIC_API_KEY

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY       # admin key; required for virtual keys & budgets
  database_url: os.environ/DATABASE_URL           # spend tracking + keys

litellm_settings:
  drop_params: true                               # ignore params a provider doesn't support
  num_retries: 2
  request_timeout: 120
  max_budget: 25                                  # USD, global ceiling across all keys
  budget_duration: 30d
